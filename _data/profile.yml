# Your bio, shown in the "About" section. Blank line = new paragraph.
bio: |
  **I'm an agricultural data scientist at Syngenta Group.** I hold a Ph.D. in Civil and Environmental Engineering from Colorado State University, where I worked in the [Remote Sensing Hydrology Group](https://www.remote-sensing-hydrology.com/). I specialize in remote sensing, machine learning and hydrologic modeling for agricultural water.

  My work brings together **satellite data, drone imagery, field sensors and machine learning** to answer practical questions about agricultural water. How **efficiently do crops use water**? How much of it comes from **rain, and how much from irrigation**? How does water use on a **single farm add up across a whole region**? How is agricultural water use **changing with climate and human intervention**? And where are **aquifers permanently losing storage** because of excessive groundwater pumping?

  Before graduate school, I spent three years as a water resources engineer in Bangladesh, working with the Bangladesh Water Development Board, in private consulting, and in research.

